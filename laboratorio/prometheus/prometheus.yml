# Prometheus consulta las métricas de la app cada 5 segundos.
# Las dos apps corren DENTRO del contenedor de Jenkins (las despliega el pipeline).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: produccion
    metrics_path: /metrics
    static_configs:
      - targets: ["jenkins:5000"]

  - job_name: staging
    metrics_path: /metrics
    static_configs:
      - targets: ["jenkins:5001"]
